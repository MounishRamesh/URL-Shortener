<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple URL Shortener</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>🔗 URL Shortener</h1>
    <p class="subtitle">Paste a long URL below and get a short link instantly.</p>

    <form id="shorten-form">
      <input
        type="text"
        id="url-input"
        placeholder="https://example.com/a/very/long/url"
        required
      />
      <input
        type="text"
        id="custom-code-input"
        placeholder="Custom alias (optional)"
      />
      <button type="submit">Shorten</button>
    </form>

    <div id="result" class="result hidden">
      <p>Your short URL:</p>
      <div class="short-url-box">
        <a id="short-url-link" href="#" target="_blank"></a>
        <button id="copy-btn">Copy</button>
      </div>
    </div>

    <div id="error" class="error hidden"></div>

    <hr>

    <h2>Recent Links</h2>
    <table id="urls-table">
      <thead>
        <tr>
          <th>Short Code</th>
          <th>Original URL</th>
          <th>Clicks</th>
        </tr>
      </thead>
      <tbody id="urls-body"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('shorten-form');
    const urlInput = document.getElementById('url-input');
    const customCodeInput = document.getElementById('custom-code-input');
    const resultDiv = document.getElementById('result');
    const errorDiv = document.getElementById('error');
    const shortUrlLink = document.getElementById('short-url-link');
    const copyBtn = document.getElementById('copy-btn');
    const urlsBody = document.getElementById('urls-body');

    async function loadUrls() {
      try {
        const res = await fetch('/api/urls');
        const data = await res.json();
        urlsBody.innerHTML = '';
        data.forEach(item => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><a href="/${item.short_code}" target="_blank">${item.short_code}</a></td>
            <td class="truncate" title="${item.original_url}">${item.original_url}</td>
            <td>${item.clicks}</td>
          `;
          urlsBody.appendChild(row);
        });
      } catch (e) {
        console.error('Failed to load urls', e);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.add('hidden');
      resultDiv.classList.add('hidden');

      const payload = {
        url: urlInput.value.trim(),
        custom_code: customCodeInput.value.trim()
      };

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok) {
          errorDiv.textContent = data.error || 'Something went wrong';
          errorDiv.classList.remove('hidden');
          return;
        }

        shortUrlLink.href = data.short_url;
        shortUrlLink.textContent = data.short_url;
        resultDiv.classList.remove('hidden');
        urlInput.value = '';
        customCodeInput.value = '';
        loadUrls();
      } catch (err) {
        errorDiv.textContent = 'Network error, please try again.';
        errorDiv.classList.remove('hidden');
      }
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortUrlLink.href);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => (copyBtn.textContent = 'Copy'), 1500);
    });

    loadUrls();
  </script>
</body>
</html>
